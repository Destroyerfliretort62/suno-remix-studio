<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#1a1035"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#7b5ea7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7b5ea7;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Glow accents -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow3)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="80" r="60" fill="none" stroke="#7b5ea7" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="150" cy="80" r="40" fill="none" stroke="#7b5ea7" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1050" cy="280" r="70" fill="none" stroke="#4a9eff" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="1050" cy="280" r="45" fill="none" stroke="#4a9eff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="320" r="90" fill="none" stroke="#c084fc" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Decorative lines -->
  <line x1="80" y1="180" x2="220" y2="180" stroke="#7b5ea7" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="980" y1="180" x2="1120" y2="180" stroke="#7b5ea7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Small decorative dots -->
  <circle cx="260" cy="120" r="2" fill="#4a9eff" fill-opacity="0.15"/>
  <circle cx="940" cy="100" r="2" fill="#c084fc" fill-opacity="0.15"/>
  <circle cx="320" cy="260" r="1.5" fill="#7b5ea7" fill-opacity="0.2"/>
  <circle cx="880" cy="250" r="1.5" fill="#4a9eff" fill-opacity="0.2"/>
  <circle cx="200" cy="220" r="1" fill="#c084fc" fill-opacity="0.25"/>
  <circle cx="1000" cy="200" r="1" fill="#7b5ea7" fill-opacity="0.25"/>

  <!-- Waveform decorative path -->
  <path d="M0 300 Q100 280 200 290 Q300 300 400 285 Q500 270 600 280 Q700 290 800 275 Q900 260 1000 285 Q1100 310 1200 290" fill="none" stroke="#4a9eff" stroke-opacity="0.06" stroke-width="1.5"/>
  <path d="M0 310 Q150 295 300 305 Q450 315 600 300 Q750 285 900 305 Q1050 325 1200 310" fill="none" stroke="#7b5ea7" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Headline -->
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">Suno V5 Pro Unlimited Remix</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Desktop companion for Suno V5 Pro users — remix any track</tspan>
    <tspan x="600" dy="30">without limits and manage version history.</tspan>
  </text>
